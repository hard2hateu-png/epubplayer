name: Settings interaction smoke test

on:
  push:
    branches:
      - restore/pre-voicebox-stable

permissions:
  contents: write

jobs:
  settings-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/pre-voicebox-stable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Keep current catalogs and install dependencies
        run: |
          git checkout origin/main -- src/locales
          npm ci
          npx playwright install --with-deps chromium
      - name: Add temporary Settings interaction test
        run: |
          cat > e2e/settings-buttons-temp.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test'

          test.describe('Settings interaction smoke test', () => {
            test.beforeEach(async ({ page }) => {
              await page.goto('/settings')
              await page.waitForLoadState('domcontentloaded')
              await expect(page.getByRole('heading', { name: 'Settings' })).toBeVisible()
            })

            test('selection rows open the matching controls and update values', async ({ page }) => {
              await page.getByText('Speed', { exact: true }).click()
              await expect(page.getByText('Speed', { exact: true }).last()).toBeVisible()
              await page.getByText('1.25×', { exact: true }).click()
              await expect(page.getByText('1.25×', { exact: true }).first()).toBeVisible()

              await page.getByText('Skip Forward', { exact: true }).click()
              await page.getByText('30 seconds', { exact: true }).click()
              await expect(page.getByText('30s', { exact: true })).toBeVisible()

              await page.getByText('Skip Back', { exact: true }).click()
              await page.getByText('15 seconds', { exact: true }).click()
              await expect(page.getByText('15s', { exact: true })).toBeVisible()

              await page.getByText('Resume Rewind', { exact: true }).click()
              await page.getByText('10 seconds', { exact: true }).click()
              await expect(page.getByText('10s', { exact: true })).toBeVisible()

              await page.getByText('Voice Engine', { exact: true }).click()
              await expect(page.getByText('Browser', { exact: true })).toBeVisible()
              await page.getByText('Browser', { exact: true }).click()
              await expect(page.getByText('Browser', { exact: true })).toBeVisible()
            })

            test('Leo row opens the Leo sheet and its controls match their labels', async ({ page }) => {
              await page.getByText('Leo Voice', { exact: true }).click()
              await expect(page.getByText('Pocket TTS on this device.', { exact: true })).toBeVisible()
              await expect(page.getByRole('button', { name: /Install Leo|Replace Leo/ })).toBeVisible()
              await expect(page.getByRole('button', { name: /Use Leo for TTS/ })).toBeVisible()
              await page.getByRole('button', { name: 'Done' }).click()
              await expect(page.getByText('Leo Voice', { exact: true })).toBeVisible()
            })

            test('navigation rows go to the routes their labels describe', async ({ page }) => {
              const routes: Array<[string, RegExp]> = [
                ['Share Library', /\/app\/share-library/],
                ['Import Library', /\/app\/receive-library/],
                ['Debug Logs', /\/app\/debug-logs/],
                ['Accessibility', /\/app\/accessibility/],
                ['Help', /\/app\/help/],
                ['Terms & Privacy', /\/app\/terms/],
              ]

              for (const [label, url] of routes) {
                await page.goto('/settings')
                await page.getByText(label, { exact: true }).click()
                await expect(page).toHaveURL(url)
              }
            })

            test('destructive rows show confirmation instead of acting silently', async ({ page }) => {
              let message = ''
              page.once('dialog', async dialog => {
                message = dialog.message()
                await dialog.dismiss()
              })
              await page.getByText('Clear All Audio', { exact: true }).click()
              await expect.poll(() => message).toContain('Delete all generated audio')

              message = ''
              page.once('dialog', async dialog => {
                message = dialog.message()
                await dialog.dismiss()
              })
              await page.getByText('Clear All Data', { exact: true }).click()
              await expect.poll(() => message).toContain('Delete ALL data')
            })
          })
          EOF
      - name: Run Settings smoke tests
        run: npx playwright test e2e/settings-buttons-temp.spec.ts --project=chromium
      - name: Commit only catalog cleanup
        run: |
          rm -f e2e/settings-buttons-temp.spec.ts .github/workflows/settings-smoke.yml
          git checkout origin/main -- src/locales
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep existing locale catalogs after stable rollback"
          git push origin HEAD:restore/pre-voicebox-stable
