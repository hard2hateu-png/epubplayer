name: Final stable rollback smoke test

on:
  push:
    branches:
      - restore/pre-voicebox-stable

permissions:
  contents: write

jobs:
  settings-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/pre-voicebox-stable
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix engine switching regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/player/PlaybackController.ts')
          text = path.read_text()
          old_call = "const newVoiceId = this.getVoiceForEngine(settings)"
          new_call = "const newVoiceId = this.getVoiceForEngine(settings, newEngine)"
          old_sig = "  }): string {\n    switch (this.currentEngine) {"
          new_sig = "  }, engine: TTSEngine = this.currentEngine): string {\n    switch (engine) {"
          if text.count(old_call) != 1:
              raise SystemExit(f'Expected one hot-swap voice call, found {text.count(old_call)}')
          if text.count(old_sig) != 1:
              raise SystemExit(f'Expected one getVoiceForEngine signature, found {text.count(old_sig)}')
          text = text.replace(old_call, new_call, 1).replace(old_sig, new_sig, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Add temporary Settings interaction test
        run: |
          cat > e2e/settings-buttons-temp.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test'

          test.describe('Settings interaction smoke test', () => {
            test.beforeEach(async ({ page }) => {
              await page.goto('/app/settings')
              await page.waitForLoadState('domcontentloaded')
              await expect(page.getByRole('heading', { name: 'Settings' })).toBeVisible()
            })

            test('selection rows open matching controls and update values', async ({ page }) => {
              await page.getByText('Speed', { exact: true }).click()
              await page.getByText('1.25×', { exact: true }).click()
              await expect(page.getByRole('button', { name: /Speed 1\.25×/ })).toBeVisible()

              await page.getByText('Skip Forward', { exact: true }).click()
              await page.getByText('30 seconds', { exact: true }).click()
              await expect(page.getByRole('button', { name: /Skip Forward 30s/ })).toBeVisible()

              await page.getByText('Skip Back', { exact: true }).click()
              await page.getByText('15 seconds', { exact: true }).click()
              await expect(page.getByRole('button', { name: /Skip Back 15s/ })).toBeVisible()

              await page.getByText('Resume Rewind', { exact: true }).click()
              await page.getByText('10 seconds', { exact: true }).click()
              await expect(page.getByRole('button', { name: /Resume Rewind 10s/ })).toBeVisible()

              await page.getByText('Voice Engine', { exact: true }).click()
              await expect(page.getByRole('option', { name: /Browser/ })).toBeVisible()
              await page.getByRole('option', { name: /Browser/ }).click()
              await expect(page.getByRole('button', { name: /Voice Engine Browser/ })).toBeVisible()
            })

            test('Leo setup exposes only actions that are currently valid', async ({ page }) => {
              await page.getByText('Leo Voice', { exact: true }).click()
              await expect(page.getByText('Pocket TTS on this device.', { exact: true })).toBeVisible()

              // A fresh browser has no private Leo reference. The sheet should offer
              // installation, not a misleading Use/Remove action that cannot work yet.
              await expect(page.getByText('Install Leo', { exact: true })).toBeVisible()
              await expect(page.locator('input[type="file"][accept*="audio"]')).toHaveCount(1)
              await expect(page.getByRole('button', { name: /Use Leo for TTS/ })).toHaveCount(0)
              await expect(page.getByRole('button', { name: /Remove Leo/ })).toHaveCount(0)

              await page.getByRole('button', { name: 'Done' }).click()
              await expect(page.getByText('Leo Voice', { exact: true })).toBeVisible()
            })

            test('navigation rows go to the routes their labels describe', async ({ page }) => {
              const routes: Array<[string, RegExp]> = [
                ['Share Library', /\/app\/share-library/],
                ['Import Library', /\/app\/receive-library/],
                ['Debug Logs', /\/app\/debug-logs/],
                ['Accessibility', /\/app\/accessibility/],
                ['Help', /\/app\/help/],
                ['Terms & Privacy', /\/app\/terms/],
              ]

              for (const [label, url] of routes) {
                await page.goto('/app/settings')
                await page.getByText(label, { exact: true }).click()
                await expect(page).toHaveURL(url)
              }
            })

            test('destructive rows require confirmation', async ({ page }) => {
              let message = ''
              page.once('dialog', async dialog => {
                message = dialog.message()
                await dialog.dismiss()
              })
              await page.getByText('Clear All Audio', { exact: true }).click()
              await expect.poll(() => message).toContain('Delete all generated audio')

              message = ''
              page.once('dialog', async dialog => {
                message = dialog.message()
                await dialog.dismiss()
              })
              await page.getByText('Clear All Data', { exact: true }).click()
              await expect.poll(() => message).toContain('Delete ALL data')
            })
          })
          EOF

      - name: Run Settings smoke tests
        run: npx playwright test e2e/settings-buttons-temp.spec.ts

      - name: Validate build and touched files
        run: |
          npx eslint src/features/player/PlaybackController.ts src/features/settings/SettingsPage.tsx src/features/settings/PocketVoiceSetupSheet.tsx src/services/storage/settingsRepository.ts src/services/tts/index.ts src/services/tts/ttsManager.ts src/services/tts/types.ts
          npm run build
          git diff --check

      - name: Commit validated final rollback
        run: |
          rm -f e2e/settings-buttons-temp.spec.ts .github/workflows/settings-smoke.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix engine switching and finalize stable rollback"
          git push origin HEAD:restore/pre-voicebox-stable
