name: Patch native Pocket selection

on:
  push:
    branches:
      - experiment-pocket-native-clean
    paths:
      - .github/workflows/patch-native-pocket-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-native-clean

      - name: Gate Pocket activation on Leo installation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/settings/SettingsPage.tsx')
          text = path.read_text()
          needle = "          } else if (engine === 'pocket') {\n"
          guard = (
              needle
              + "            // Keep the current working engine until native Leo is actually ready.\n"
              + "            const hasLeo = await pocketService.hasLeoVoiceSample()\n"
              + "            if (!hasLeo) {\n"
              + "              setActiveSheet('pocketLeo')\n"
              + "              return\n"
              + "            }\n"
          )

          if guard in text:
              raise SystemExit('Pocket install guard already present; refusing duplicate insertion.')
          if needle not in text:
              raise SystemExit('Pocket engine-selection block was not found; refusing to patch.')

          path.write_text(text.replace(needle, guard, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/settings/SettingsPage.tsx
          git commit -m "Gate Pocket selection until Leo is installed"
          git push origin HEAD:experiment-pocket-native-clean
