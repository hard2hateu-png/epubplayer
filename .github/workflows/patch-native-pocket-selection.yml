name: Patch native Pocket selection

on:
  push:
    branches:
      - experiment-pocket-native-clean
    paths:
      - .github/workflows/patch-native-pocket-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-native-clean

      - name: Gate Pocket activation on Leo installation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/settings/SettingsPage.tsx')
          text = path.read_text()

          old = """          } else if (engine === 'pocket') {
            // Unique cache identity for Leo. Pocket itself always uses the local Leo clone.
            await settingsRepository.set('voiceId', 'pocket:leo')
            setSettings((prev) => ({ ...prev, voiceId: 'pocket:leo' }))
          }

          // PlaybackController currently resolves the outgoing engine's voice during a hot-swap.
          // A one-time page reload when switching to/from Pocket avoids a transient wrong cache key
          // without changing the stable playback controller used by the existing engines.
          const switchingToOrFromPocket = engine === 'pocket' || settings.ttsEngine === 'pocket'
          if (switchingToOrFromPocket) {
            await settingsRepository.set('ttsEngine', engine)
            setSettings((prev) => ({ ...prev, ttsEngine: engine }))
            setActiveSheet(null)
            ttsManager.destroy()
            window.location.reload()
            return
          }
"""

          new = """          } else if (engine === 'pocket') {
            // Do not switch the reader into Pocket until Leo actually exists.
            // This keeps the currently working engine active while the setup sheet
            // handles the one-time reference upload and native voice preparation.
            const hasLeo = await pocketService.hasLeoVoiceSample()
            if (!hasLeo) {
              setActiveSheet('pocketLeo')
              return
            }

            await settingsRepository.set('voiceId', 'pocket:leo')
            setSettings((prev) => ({ ...prev, voiceId: 'pocket:leo' }))
          }

          // PlaybackController currently resolves the outgoing engine's voice during a hot-swap.
          // Reload only after Pocket has a valid Leo voice, or when leaving Pocket.
          const switchingToOrFromPocket = engine === 'pocket' || settings.ttsEngine === 'pocket'
          if (switchingToOrFromPocket) {
            await settingsRepository.set('ttsEngine', engine)
            setSettings((prev) => ({ ...prev, ttsEngine: engine }))
            setActiveSheet(null)
            ttsManager.destroy()
            window.location.reload()
            return
          }
"""

          if old not in text:
            raise SystemExit('Expected Pocket engine-selection block was not found; refusing to patch.')

          path.write_text(text.replace(old, new, 1))

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/settings/SettingsPage.tsx
          git commit -m "Gate Pocket selection until Leo is installed"
          git push origin HEAD:experiment-pocket-native-clean
