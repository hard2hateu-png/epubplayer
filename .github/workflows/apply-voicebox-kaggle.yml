name: Apply Voicebox Kaggle settings patch

on:
  push:
    branches:
      - feat/voicebox-kaggle-host

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voicebox-kaggle-host
      - name: Switch Voicebox setup from Colab to Kaggle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/settings/VoiceboxRemoteSetupSheet.tsx')
          s = p.read_text()
          replacements = {
            "const COLAB_URL = 'https://colab.research.google.com/github/hard2hateu-png/epubplayer/blob/main/tools/Voicebox_Free_Colab.ipynb'": "const KAGGLE_URL = 'https://www.kaggle.com/notebooks/welcome?src=https://github.com/hard2hateu-png/epubplayer/blob/main/tools/Voicebox_Free_Kaggle.ipynb'",
            "Free/open-source Voicebox + Qwen3-TTS. The GPU runs in Google Colab, not on your iPhone.": "Free/open-source Voicebox + Qwen3-TTS. The GPU runs in Kaggle, not on your iPhone.",
            "This uses the actual jamiepine/voicebox backend. A free Colab GPU session supplies the compute. Free Colab sessions are temporary, so you will start the notebook again when a session expires.": "This uses the actual jamiepine/voicebox backend. A free Kaggle GPU session supplies the compute. Kaggle sessions can keep running in the cloud while you switch back to this reader; sessions are temporary and use your Kaggle GPU quota.",
            "href={COLAB_URL}": "href={KAGGLE_URL}",
            "Open Free Voicebox Colab": "Open Free Voicebox Kaggle",
            "In Colab choose a GPU runtime, then Run all. The last cell gives you a button that pairs the temporary Voicebox server with this reader automatically.": "In Kaggle, turn Internet ON, choose a GPU accelerator, then Run All. The final cell intentionally stays running and gives you a button that pairs the Voicebox server with this reader automatically.",
            "temporary Colab session": "temporary Kaggle session",
            "Generated by the Colab notebook": "Generated by the Kaggle notebook",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/settings/VoiceboxRemoteSetupSheet.tsx
          git commit -m "Use Kaggle for free Voicebox GPU hosting"
          git push origin HEAD:feat/voicebox-kaggle-host
