name: Chatterbox end-to-end smoke test

on:
  push:
    branches:
      - feat/chatterbox-turbo

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Make Chatterbox on-demand instead of eager preload
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/tts/ttsManager.ts')
          text = p.read_text()
          old = """  chatterbox: {
    id: 'chatterbox',
    name: 'Chatterbox (Leo)',
    description: 'English Chatterbox-Turbo voice cloning using the saved Leo reference.',
    available: true,
    capabilities: {
      generatesBlobs: true,
      requiresInit: true,
      slowOnCPU: false,
    },
  },"""
          new = """  chatterbox: {
    id: 'chatterbox',
    name: 'Chatterbox (Leo)',
    description: 'English Chatterbox-Turbo voice cloning using the saved Leo reference.',
    available: true,
    capabilities: {
      generatesBlobs: true,
      // Remote initialization is intentionally deferred until Play/generation.
      // This avoids consuming ZeroGPU time just from browsing or selecting the engine.
      requiresInit: false,
      slowOnCPU: false,
    },
  },"""
          if text.count(old) != 1:
              raise SystemExit('Could not find exact Chatterbox registry block')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate one public-sample test clip
        timeout-minutes: 5
        run: |
          node --input-type=module <<'NODE'
          import { Client, handle_file } from '@gradio/client'
          const refUrl = 'https://storage.googleapis.com/chatterbox-demo-samples/turbo/2.wav'
          const refResponse = await fetch(refUrl)
          if (!refResponse.ok) throw new Error(`Reference fetch failed: ${refResponse.status}`)
          const reference = await refResponse.blob()
          const app = await Client.connect('ResembleAI/chatterbox-turbo-demo')
          const result = await app.predict('/generate', [
            'Hello. This is a short Chatterbox test.',
            handle_file(reference),
            0.8, 42, 0.0, 0.95, 1000, 1.2, true,
          ])
          const output = result?.data?.[0]
          console.log('Output kind:', typeof output)
          console.log('Output keys:', output && typeof output === 'object' ? Object.keys(output) : [])
          const url = typeof output === 'string' ? output : output?.url
          if (!url) throw new Error(`No audio URL in output: ${JSON.stringify(output).slice(0, 500)}`)
          const audio = await fetch(url)
          console.log('Audio fetch:', audio.status, audio.headers.get('content-type'), audio.headers.get('content-length'))
          if (!audio.ok) throw new Error(`Generated audio fetch failed: ${audio.status}`)
          const bytes = (await audio.arrayBuffer()).byteLength
          if (bytes < 1000) throw new Error(`Generated audio unexpectedly small: ${bytes} bytes`)
          console.log('Chatterbox smoke test passed:', bytes, 'bytes')
          NODE

      - name: Commit lazy-init tweak and remove this temporary workflow
        run: |
          rm -f .github/workflows/chatterbox-smoke.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Defer Chatterbox connection until playback"
          git push origin HEAD:feat/chatterbox-turbo
