name: Chatterbox end-to-end smoke test

on:
  push:
    branches:
      - feat/chatterbox-turbo

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Make Chatterbox on-demand
        run: python tools/chatterbox_lazy_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate one public-sample test clip
        timeout-minutes: 5
        run: node tools/chatterbox_smoke.mjs

      - name: Commit verified lazy-init change and remove temporary test files
        run: |
          rm -f .github/workflows/chatterbox-smoke.yml tools/chatterbox_lazy_patch.py tools/chatterbox_smoke.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Defer Chatterbox connection until playback"
          git push origin HEAD:feat/chatterbox-turbo
