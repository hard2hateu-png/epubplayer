name: Clean Chatterbox branch

on:
  push:
    branches:
      - feat/chatterbox-turbo-clean

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore unchanged locale catalogs and validate backend syntax
        run: |
          git fetch origin main
          git checkout origin/main -- src/locales
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('infra/chatterbox-hf-space/app.py').read_text())
          print('ZeroGPU backend syntax OK')
          PY

      - name: Remove this temporary workflow and commit cleanup
        run: |
          rm -f .github/workflows/cleanup-chatterbox-branch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clean Chatterbox branch and keep locale catalogs unchanged"
          git push origin HEAD:feat/chatterbox-turbo-clean
