name: Apply and verify Chatterbox Turbo

on:
  push:
    branches:
      - feat/chatterbox-turbo

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Chatterbox patch
        run: python tools/apply_chatterbox_patch.py

      - name: Add Gradio browser client
        run: npm install --save-exact @gradio/client@2.5.1

      - name: Verify official Chatterbox API
        run: |
          node --input-type=module <<'NODE'
          import { Client } from '@gradio/client'
          const app = await Client.connect('ResembleAI/chatterbox-turbo-demo')
          const api = await app.view_api()
          const names = Object.keys(api.named_endpoints || {})
          console.log('Named endpoints:', names)
          if (!names.includes('/generate')) {
            throw new Error(`Expected /generate endpoint, found: ${names.join(', ')}`)
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified implementation and remove temporary patch files
        run: |
          rm -f tools/apply_chatterbox_patch.py .github/workflows/apply-chatterbox.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Chatterbox Turbo Leo voice cloning"
          git push origin HEAD:feat/chatterbox-turbo
