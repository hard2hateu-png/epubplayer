name: Apply iOS Pocket stability patch

on:
  push:
    branches:
      - fix/ios-pocket-crash

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-pocket-crash
          fetch-depth: 0

      - name: Apply stability changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Stop iOS PWA from forcing controller-change reload loops.
          p = Path('src/main.tsx')
          s = p.read_text()
          old = """let swRegistration: ServiceWorkerRegistration | undefined\nlet reloadingForServiceWorker = false\nconst hadServiceWorkerControllerAtStartup = Boolean(navigator.serviceWorker?.controller)\n"""
          assert old in s
          s = s.replace(old, "", 1)

          old = """// iOS can keep a Home Screen PWA's old JavaScript alive even after a newer\n// service worker has activated. Reload exactly once when an existing install\n// changes controllers so the page immediately starts using the new app bundle.\nif ('serviceWorker' in navigator) {\n  navigator.serviceWorker.addEventListener('controllerchange', () => {\n    if (!hadServiceWorkerControllerAtStartup || reloadingForServiceWorker) return\n    reloadingForServiceWorker = true\n    log.info('New Service Worker activated; reloading app shell')\n    window.location.reload()\n  })\n}\n\n"""
          assert old in s
          s = s.replace(old, "", 1)

          old = """  } else {\n    // Check promptly when an installed PWA returns to the foreground instead\n    // of waiting for WebKit's normal service-worker update interval.\n    void swRegistration?.update().catch((error) => {\n      log.warn('Service Worker update check failed', { error })\n    })\n  }\n"""
          assert old in s
          s = s.replace(old, "  }\n", 1)

          old = """  onRegistered(registration) {\n    swRegistration = registration\n    log.info('Service Worker registered', { scope: registration?.scope })\n    void registration?.update().catch((error) => {\n      log.warn('Initial Service Worker update check failed', { error })\n    })\n  },\n"""
          new = """  onRegistered(registration) {\n    log.info('Service Worker registered', { scope: registration?.scope })\n  },\n"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Do not pre-initialize Pocket on iOS. It will initialize on the first real playback request.
          p = Path('src/features/player/PlaybackController.ts')
          s = p.read_text()
          old = """        if (capabilities.requiresInit && !ttsManager.getIsReady() && !ttsManager.getIsLoading()) {\n          log.debug('Pre-initializing TTS engine')\n          ttsManager.initialize().catch((err) => {\n            log.error('TTS pre-initialization failed', err)\n          })\n        }\n"""
          new = """        const deferPocketOnIOS =\n          this.currentEngine === 'pocket' &&\n          typeof navigator !== 'undefined' &&\n          (/iPad|iPhone|iPod/.test(navigator.userAgent || '') ||\n            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))\n\n        if (!deferPocketOnIOS && capabilities.requiresInit && !ttsManager.getIsReady() && !ttsManager.getIsLoading()) {\n          log.debug('Pre-initializing TTS engine')\n          ttsManager.initialize().catch((err) => {\n            log.error('TTS pre-initialization failed', err)\n          })\n        } else if (deferPocketOnIOS) {\n          log.info('Deferring Pocket TTS initialization until Play on iOS')\n        }\n"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Make Pocket voice preparation and inference gentler on iOS.
          p = Path('src/services/tts/pocketService.ts')
          s = p.read_text()

          marker = """function localUrl(path: string): string {\n"""
          insert = """function isIOSDevice(): boolean {\n  if (typeof navigator === 'undefined') return false\n  const ua = navigator.userAgent || ''\n  return /iPad|iPhone|iPod/.test(ua) ||\n    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)\n}\n\nfunction averageEmbeddings(items: VoiceEmbedding[]): VoiceEmbedding {\n  if (!items.length) throw new Error('No Leo voice embeddings were produced')\n  const first = items[0]\n  const shape = first.shape.slice()\n  const length = first.data.length\n  for (const item of items) {\n    if (item.data.length !== length || item.shape.join(',') !== shape.join(',')) {\n      throw new Error('Leo voice embedding shapes did not match')\n    }\n  }\n  const data = new Float32Array(length)\n  for (const item of items) {\n    for (let i = 0; i < length; i++) data[i] += item.data[i] / items.length\n  }\n  return { data, shape }\n}\n\n"""
          assert marker in s
          s = s.replace(marker, insert + marker, 1)

          assert "      maxThreads: 4," in s
          s = s.replace("      maxThreads: 4,", "      maxThreads: isIOSDevice() ? 1 : 4,", 1)

          old = """      const maxChunkChars = await settingsRepository.get('maxChunkChars')\n      this.config = { maxChunkChars: Math.min(MAX_CHUNK_CHARS, Math.max(120, maxChunkChars)) }\n"""
          new = """      const maxChunkChars = await settingsRepository.get('maxChunkChars')\n      const deviceMaxChunkChars = isIOSDevice() ? 150 : MAX_CHUNK_CHARS\n      this.config = { maxChunkChars: Math.min(deviceMaxChunkChars, Math.max(120, maxChunkChars)) }\n"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """      if (!candidate) {\n        const reference = await this.getReference()\n        candidate = await this.createRuntime(false)\n        const rate = candidate.bundle?.sampleRate || SAMPLE_RATE\n        this.onProgressCallback?.('Preparing the full Leo reference...', 99)\n        const pcm = await decodeReference(reference, rate)\n        if (pcm.length < rate) throw new Error('Leo voice sample is too short')\n        const embedding = await candidate.cloneVoice(pcm)\n        await this.saveEmbedding(embedding)\n        log.info('Prepared the full Leo reference', { seconds: pcm.length / rate })\n      }\n"""
          new = """      if (!candidate) {\n        const reference = await this.getReference()\n        candidate = await this.createRuntime(false)\n        const rate = candidate.bundle?.sampleRate || SAMPLE_RATE\n        const pcm = await decodeReference(reference, rate)\n        if (pcm.length < rate) throw new Error('Leo voice sample is too short')\n\n        let embedding: VoiceEmbedding\n        if (isIOSDevice() && pcm.length > rate * 12) {\n          // WebKit is much more stable when the voice encoder sees ~10-second pieces\n          // instead of one 42-second tensor. Every part of the stored reference still\n          // contributes to Leo: encode each piece, then average the fixed-size embeddings.\n          const segmentCount = Math.max(2, Math.ceil(pcm.length / (rate * 11)))\n          const segmentLength = Math.ceil(pcm.length / segmentCount)\n          const embeddings: VoiceEmbedding[] = []\n          for (let index = 0; index < segmentCount; index++) {\n            const start = index * segmentLength\n            const end = Math.min(pcm.length, start + segmentLength)\n            if (end - start < rate * 2) continue\n            this.onProgressCallback?.(`Preparing Leo voice ${index + 1}/${segmentCount}...`, 99)\n            embeddings.push(await candidate.cloneVoice(pcm.slice(start, end)))\n            await new Promise<void>((resolve) => setTimeout(resolve, 25))\n          }\n          embedding = averageEmbeddings(embeddings)\n        } else {\n          this.onProgressCallback?.('Preparing the full Leo reference...', 99)\n          embedding = await candidate.cloneVoice(pcm)\n        }\n\n        await this.saveEmbedding(embedding)\n        log.info('Prepared the full Leo reference', { seconds: pcm.length / rate })\n\n        if (isIOSDevice()) {\n          // Drop the voice-cloning runtime before narration so the large encoder\n          // is not resident alongside the synthesis model during playback.\n          candidate.destroy()\n          candidate = await this.createRuntime(true)\n          this.onProgressCallback?.('Loading saved Leo voice...', 99)\n          await candidate.loadVoiceEmbedding(embedding)\n        }\n      }\n"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 4) Keep Pocket's iOS look-ahead tiny; foreground playback can still generate on demand.
          p = Path('src/features/player/TTSBufferManager.ts')
          s = p.read_text()
          old = """const IOS_MAX_BUFFER_CHUNKS = 12\n"""
          new = """const IOS_MAX_BUFFER_CHUNKS = 12\nconst IOS_POCKET_MAX_BUFFER_CHUNKS = 2\n\nfunction getIOSBufferLimit(engine?: TTSEngine): number {\n  return engine === 'pocket' ? IOS_POCKET_MAX_BUFFER_CHUNKS : IOS_MAX_BUFFER_CHUNKS\n}\n"""
          assert old in s
          s = s.replace(old, new, 1)

          s = s.replace(
            "const iosLimit = isIOSDevice() ? IOS_MAX_BUFFER_CHUNKS : undefined",
            "const iosLimit = isIOSDevice() ? getIOSBufferLimit(this.ctx?.engine) : undefined",
            1,
          )
          s = s.replace(
            "await pushFrom(startSection, startChunk, IOS_MAX_BUFFER_CHUNKS)",
            "await pushFrom(startSection, startChunk, getIOSBufferLimit(this.ctx?.engine))",
            1,
          )
          s = s.replace(
            "const maxIOSChunks = isIOSDevice() ? IOS_MAX_BUFFER_CHUNKS : Number.POSITIVE_INFINITY",
            "const maxIOSChunks = isIOSDevice() ? getIOSBufferLimit(this.ctx?.engine) : Number.POSITIVE_INFINITY",
            1,
          )

          old = """          await this.waitForWakeOrTimeout(isIOSDevice() ? 40 : 0)\n"""
          new = """          const iOSBreather = isIOSDevice() ? (this.ctx?.engine === 'pocket' ? 500 : 40) : 0\n          await this.waitForWakeOrTimeout(iOSBreather)\n"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git status --short

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/features/player/PlaybackController.ts src/services/tts/pocketService.ts src/features/player/TTSBufferManager.ts
          if git diff --cached --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git commit -m "Reduce Pocket TTS memory pressure on iOS"
          git push origin HEAD:fix/ios-pocket-crash
