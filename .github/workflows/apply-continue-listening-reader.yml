name: Apply Continue Listening reader fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-continue-listening-reader.cjs'
      - '.github/workflows/apply-continue-listening-reader.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Continue Listening fix
        run: node scripts/fix-continue-listening-reader.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/library/BookDetailPage.tsx src/features/player/NowPlayingPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Open Continue Listening directly in reader view"
            git push origin HEAD:main
          fi
