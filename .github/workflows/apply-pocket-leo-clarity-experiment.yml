name: Apply Pocket Leo clarity experiment

on:
  push:
    branches:
      - experiment-pocket-leo-clarity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-leo-clarity
          fetch-depth: 0

      - name: Apply isolated Leo clarity patch
        run: python .github/scripts/apply_pocket_leo_clarity_experiment.py

      - name: Check diff
        run: git diff --check

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/tts/pocketService.ts
          if git diff --cached --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git commit -m "Test clearer Leo conditioning window"
          git push origin HEAD:experiment-pocket-leo-clarity
