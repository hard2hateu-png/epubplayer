name: Restore pre-Voicebox stable app

on:
  push:
    branches:
      - restore/pre-voicebox-stable

permissions:
  contents: write

jobs:
  restore-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/pre-voicebox-stable
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore last stable pre-hosted-TTS runtime
        run: |
          BASELINE=b11f46ec45d008ba2deaee4bde33f67c95c796ab
          git checkout "$BASELINE" -- \
            src/features/player/PlaybackController.ts \
            src/features/player/TTSBufferManager.ts \
            src/features/settings/SettingsPage.tsx \
            src/locales \
            src/services/tts/index.ts \
            src/services/tts/ttsManager.ts \
            src/services/tts/types.ts

          rm -f \
            api/voicebox-relay.js \
            docs/VOICEBOX_FREE_COLAB.md \
            docs/VOICEBOX_TRIAL.md \
            src/features/settings/VoiceboxRemoteSetupSheet.tsx \
            src/services/tts/voiceboxRemoteService.ts \
            tools/Voicebox_Free_Colab.ipynb \
            tools/Voicebox_Free_Kaggle.ipynb

      - name: Simplify Settings and migrate stale hosted-TTS state
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int | None = None) -> None:
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"{path}: expected text not found: {old[:120]!r}")
              if count is not None and found < count:
                  raise SystemExit(f"{path}: expected >= {count} matches, found {found}: {old[:120]!r}")
              p.write_text(text.replace(old, new, -1 if count is None else count))

          # Settings: shorter names and descriptions.
          p = 'src/features/settings/SettingsPage.tsx'
          replacements = {
              "t`Browser (Instant)`": "t`Browser`",
              "t`Uses your device's built-in voices. Fast and reliable.`": "t`Built-in device voice.`",
              "t`Supertonic (Recommended)`": "t`Supertonic`",
              "t`AI voice with great quality and speed. Works on most devices. ~260MB download.`": "t`Fast local AI voice.`",
              "t`Pocket TTS (Leo)`": "t`Pocket — Leo`",
              "t`Custom on-device Leo voice clone. Requires a local voice sample and downloads its model on first use.`": "t`Leo custom voice on this device.`",
              "t`Sherpa (Multi-Speaker)`": "t`Sherpa`",
              "t`Neural TTS with 900+ voices. Proper phonemization. ~100MB download.`": "t`Local multi-speaker voice.`",
              "t`Kokoro (Premium)`": "t`Kokoro`",
              "t`Highest quality AI voice. Requires powerful GPU for smooth playback.`": "t`High-quality local AI voice.`",
              "t`Kitten (Light)`": "t`Kitten`",
              "t`Lightweight AI voice. Fast on any device, no GPU needed. ~24MB download.`": "t`Lightweight local AI voice.`",
              "t`Piper (Experimental)`": "t`Piper`",
              "t`⚠️ Under development - may not work yet.`": "t`Experimental local voice.`",
              "t`Fastest, smallest (WASM only)`": "t`Smallest.`",
              "t`Good balance (WASM only)`": "t`Balanced.`",
              "t`Higher quality (WASM only)`": "t`Higher quality.`",
              "t`Best quality, required for WebGPU`": "t`Best quality.`",
              "t`Use WebGPU if available, otherwise CPU (WASM)`": "t`Recommended.`",
              "t`Fast but uses fp32 model (~80MB)`": "t`Faster.`",
              "t`Slow but supports smaller quantized models`": "t`Fallback.`",
              "t`Best performance — fast and smooth playback`": "t`Faster.`",
              "t`Fallback if WebGPU is unavailable`": "t`Fallback.`",
              "'Up to 3 min / 12 chunks'": "'3 min / 12 max'",
              "'Buffers about 3 minutes ahead, with a 12-chunk iPhone safety limit'": "'About 3 minutes ahead.'",
              "'Up to 10 min / 12 chunks'": "'10 min / 12 max'",
              "'Buffers until 10 minutes ahead or the 12-chunk iPhone safety limit, whichever comes first'": "'Up to 10 minutes ahead.'",
              "'Up to 30 min / 12 chunks'": "'30 min / 12 max'",
              "'Buffers until 30 minutes ahead or the 12-chunk iPhone safety limit, whichever comes first'": "'Up to 30 minutes ahead.'",
              "'Chapter + transition'": "'Chapter / 12 max'",
              "'Buffers up to 12 chunks from this chapter; if there is room, also readies up to 3 chunks from the next chapter'": "'Current chapter, up to 12 chunks.'",
              "'Keeps up to 12 chunks ready in the current chapter'": "'Current chapter only.'",
              "t`Default Speed`": "t`Speed`",
              "t`Auto-rewind on Resume`": "t`Resume Rewind`",
              "t`Choose speed vs quality`": "t`Choose a voice engine`",
              "t`Pocket TTS — Leo`": "t`Leo Voice`",
              "t`Install or replace the private local Leo voice sample`": "t`Manage Pocket TTS voice`",
              "t`10 high-quality AI voices`": "t`10 voices`",
              "t`Processing Device`": "t`Processor`",
              "t`WebGPU is fastest; WASM is fallback for older devices`": "t`WebGPU or WASM`",
              "t`Buffer Ahead`": "t`Preload Audio`",
              "t`Keeps generating ahead even while paused`": "t`Generate upcoming audio`",
              "t`Local custom Pocket TTS voice`": "t`Pocket TTS`",
              "t`Voice sample required`": "t`Voice sample needed`",
              "t`Uses the same generated-audio cache and iPhone safety limit`": "t`Generate upcoming audio`",
              "t`Each voice is a different neural model`": "t`One model per voice`",
              "t`900+ AI voices available`": "t`900+ voices`",
              "t`8 lightweight AI voices`": "t`8 voices`",
              "t`Model Quality`": "t`Quality`",
              "t`WebGPU always uses fp32; quantized models are WASM-only`": "t`Used for CPU mode`",
              "t`WebGPU is fastest when supported`": "t`WebGPU is faster`",
              "t`Remove all generated audio to free up space`": "t`Delete generated audio`",
              "t`Remove all books, audio, and settings`": "t`Delete books, audio, and settings`",
              "t`Send your books to another device`": "t`Send books to another device`",
              "t`Receive books from another device`": "t`Receive books from another device`",
              "t`View/copy logs on mobile (including TTS worker)`": "t`View or copy logs`",
              "t`Keyboard shortcuts, screen reader support`": "t`Keyboard and screen reader`",
              "t`Help & How it works`": "t`Help`",
              "t`Select Voice`": "t`Voice`",
              "t`Select Piper Voice`": "t`Piper Voice`",
              "t`Select Supertonic Voice`": "t`Supertonic Voice`",
              "t`Supertonic Processing Device`": "t`Supertonic Processor`",
              "t`Select Sherpa Voice`": "t`Sherpa Voice`",
              "t`Select Kitten Voice`": "t`Kitten Voice`",
              "t`Skip Forward Interval`": "t`Skip Forward`",
              "t`Skip Back Interval`": "t`Skip Back`",
          }
          for old, new in replacements.items():
              replace(p, old, new)

          # Keep the two TTS labels semantically distinct: chooser vs read-only About row.
          replace(
              p,
              "label={t`TTS Engine`}\n            value={getEngineName(settings.ttsEngine)}",
              "label={t`Voice Engine`}\n            value={getEngineName(settings.ttsEngine)}",
              1,
          )
          replace(p, "title={t`TTS Engine`}", "title={t`Voice Engine`}", 1)
          replace(
              p,
              "label={t`TTS Engine`}\n            value={\n              settings.ttsEngine",
              "label={t`Active TTS`}\n            value={\n              settings.ttsEngine",
              1,
          )

          # Short iPhone buffer summary values.
          replace(p, "return 'Chapter + transition'", "return 'Chapter / 12 max'")
          replace(p, "return 'Up to ' + settings.bufferAheadMinutes + ' min / 12 chunks'", "return settings.bufferAheadMinutes + ' min / 12 max'")

          # Never let long labels/descriptions/values blow out the Settings row.
          replace(
              p,
              """      <div className=\"min-w-0 flex-1\">\n        <p className={`font-medium ${danger ? 'text-error' : 'text-text-primary'}`}>{label}</p>\n        {description && <p className=\"mt-0.5 text-xs text-text-muted\">{description}</p>}\n      </div>\n      {value && <span className=\"text-sm text-text-secondary\">{value}</span>}\n""",
              """      <div className=\"min-w-0 flex-1\">\n        <p\n          className={`truncate font-medium ${danger ? 'text-error' : 'text-text-primary'}`}\n          title={label}\n        >\n          {label}\n        </p>\n        {description && (\n          <p className=\"mt-0.5 truncate text-xs text-text-muted\" title={description}>\n            {description}\n          </p>\n        )}\n      </div>\n      {value && (\n        <span\n          className=\"max-w-[45%] flex-shrink-0 truncate text-right text-sm text-text-secondary\"\n          title={value}\n        >\n          {value}\n        </span>\n      )}\n""",
              1,
          )
          replace(
              p,
              """              <div className=\"flex-1\">\n                <p className=\"font-medium text-text-primary\">{option.label}</p>\n                {option.description && (\n                  <p className=\"mt-0.5 text-xs text-text-muted\">{option.description}</p>\n                )}\n              </div>\n""",
              """              <div className=\"min-w-0 flex-1\">\n                <p className=\"truncate font-medium text-text-primary\" title={option.label}>\n                  {option.label}\n                </p>\n                {option.description && (\n                  <p className=\"mt-0.5 truncate text-xs text-text-muted\" title={option.description}>\n                    {option.description}\n                  </p>\n                )}\n              </div>\n""",
              1,
          )

          # Pocket/Leo sheet: wording only. Behavior remains the known-good baseline.
          p = 'src/features/settings/PocketVoiceSetupSheet.tsx'
          replacements = {
              "Pocket TTS — Leo": "Leo Voice",
              "Private custom voice stored only on this device.": "Pocket TTS on this device.",
              "Pocket TTS uses the complete stored Leo clip—up to 42 seconds—instead\n              of choosing only the loudest 10-second section. The previous app's saved\n              reference is recovered automatically when available.": "Uses your saved Leo reference on this device.",
              "Leo is the active voice": "Leo is active",
              "TTS Engine is Pocket TTS and the reader voice is Leo.": "Pocket TTS is selected.",
              "Faster after the first preparation": "Saved locally",
              "The first run creates a compact Leo voice fingerprint. It stays on this\n              device, so later launches skip re-analyzing the full audio and avoid\n              loading the extra voice-encoder model.": "After first setup, Leo starts faster.",
              "Replace Leo reference": "Replace Leo",
              "Install Leo reference": "Install Leo",
              "Remove Leo reference": "Remove Leo",
              "Preparing Leo from the complete reference. The first preparation can take a while; later launches reuse the saved voice fingerprint.": "Preparing Leo. First setup can take a while.",
              "Leo is ready. Activating Pocket TTS…": "Leo is ready.",
              "Leo voice reference and saved fingerprint were removed from this device.": "Leo was removed from this device.",
              "Pocket TTS still downloads its on-device model files the first time.\n            The reference, model files, and prepared fingerprint remain in browser\n            storage for later use.": "Pocket downloads its model once and keeps it on this device.",
          }
          for old, new in replacements.items():
              replace(p, old, new)

          # Settings migration: an iPhone that previously selected Voicebox/Qwen must
          # automatically recover to a supported engine after the rollback.
          p = Path('src/services/storage/settingsRepository.ts')
          text = p.read_text()
          anchor = "export type SettingValue<K extends SettingKey> = Settings[K]\n\n"
          insert = """export type SettingValue<K extends SettingKey> = Settings[K]\n\nconst SUPPORTED_TTS_ENGINES = new Set<TTSEngine>([\n  'browser',\n  'piper',\n  'kokoro',\n  'supertonic',\n  'sherpa',\n  'kitten',\n  'pocket',\n])\n\nfunction normalizeStoredTTSEngine(value: unknown): TTSEngine {\n  return typeof value === 'string' && SUPPORTED_TTS_ENGINES.has(value as TTSEngine)\n    ? value as TTSEngine\n    : 'supertonic'\n}\n\n"""
          if anchor not in text:
              raise SystemExit('settingsRepository.ts: type anchor missing')
          text = text.replace(anchor, insert, 1)
          old_get = """    const setting = await db.settings.get(key)\n    if (setting) {\n      return setting.value as SettingValue<K>\n    }\n    return DEFAULT_SETTINGS[key]\n"""
          new_get = """    const setting = await db.settings.get(key)\n    if (setting) {\n      if (key === 'ttsEngine') {\n        const engine = normalizeStoredTTSEngine(setting.value)\n        if (setting.value !== engine) await db.settings.put({ key: 'ttsEngine', value: engine })\n        return engine as SettingValue<K>\n      }\n      return setting.value as SettingValue<K>\n    }\n    return DEFAULT_SETTINGS[key]\n"""
          if old_get not in text:
              raise SystemExit('settingsRepository.ts: get() block missing')
          text = text.replace(old_get, new_get, 1)
          old_loop = """    for (const setting of stored) {\n      const key = setting.key as SettingKey\n      if (key in settings) {\n        // @ts-expect-error - We know the types match\n        settings[key] = setting.value\n      }\n    }\n"""
          new_loop = """    for (const setting of stored) {\n      const key = setting.key as SettingKey\n      if (!(key in settings)) continue\n\n      if (key === 'ttsEngine') {\n        const engine = normalizeStoredTTSEngine(setting.value)\n        settings.ttsEngine = engine\n        if (setting.value !== engine) await db.settings.put({ key: 'ttsEngine', value: engine })\n        continue\n      }\n\n      // @ts-expect-error - We know the types match\n      settings[key] = setting.value\n    }\n"""
          if old_loop not in text:
              raise SystemExit('settingsRepository.ts: getAll() loop missing')
          p.write_text(text.replace(old_loop, new_loop, 1))

          print('Stable rollback + Settings cleanup applied.')
          PY

      - name: Verify button wiring and hosted-TTS removal
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('src/features/settings/SettingsPage.tsx').read_text()
          pocket = Path('src/features/settings/PocketVoiceSetupSheet.tsx').read_text()

          expected_settings = [
              "onClick={() => navigate(-1)}",
              "onClick={() => setActiveSheet('speed')}",
              "onClick={() => setActiveSheet('skipForward')}",
              "onClick={() => setActiveSheet('skipBack')}",
              "onClick={() => setActiveSheet('autoRewind')}",
              "onClick={() => setActiveSheet('ttsEngine')}",
              "onClick={() => setActiveSheet('pocketLeo')}",
              "onClick={handleClearAllAudio}",
              "onClick={handleClearAllData}",
              "onClick={() => navigate('/app/share-library')}",
              "onClick={() => navigate('/app/receive-library')}",
              "onClick={() => navigate('/app/debug-logs')}",
              "onClick={() => navigate('/app/accessibility')}",
              "onClick={() => navigate('/app/help')}",
              "onClick={() => navigate('/app/terms')}",
              "if (engine === 'pocket')",
              "await updateSetting('ttsEngine', engine)",
          ]
          missing = [item for item in expected_settings if item not in settings]
          if missing:
              raise SystemExit('Settings button/wiring checks missing: ' + repr(missing))

          expected_pocket = [
              'onClick={onClose}',
              'onClick={() => void handleUseLeo()}',
              'void handleFile(file)',
              'onClick={() => void handleRemove()}',
              "await settingsRepository.set('ttsEngine', 'pocket')",
              "await settingsRepository.set('ttsEngine', 'supertonic')",
          ]
          missing = [item for item in expected_pocket if item not in pocket]
          if missing:
              raise SystemExit('Leo button/wiring checks missing: ' + repr(missing))

          forbidden = []
          for root in ('src', 'api'):
              base = Path(root)
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if path.is_file() and path.suffix in {'.ts', '.tsx', '.js', '.jsx'}:
                      body = path.read_text(errors='ignore').lower()
                      if 'voicebox' in body or 'qwen3-tts' in body or "'qwen'" in body or '"qwen"' in body:
                          forbidden.append(str(path))
          if forbidden:
              raise SystemExit('Hosted TTS references still present: ' + ', '.join(forbidden))

          for removed in [
              'api/voicebox-relay.js',
              'src/features/settings/VoiceboxRemoteSetupSheet.tsx',
              'src/services/tts/voiceboxRemoteService.ts',
              'tools/Voicebox_Free_Colab.ipynb',
              'tools/Voicebox_Free_Kaggle.ipynb',
              'docs/VOICEBOX_FREE_COLAB.md',
              'docs/VOICEBOX_TRIAL.md',
          ]:
              if Path(removed).exists():
                  raise SystemExit(f'Should have been removed: {removed}')

          print('Button routes/actions present; hosted Voicebox/Qwen runtime removed.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint touched runtime files
        run: npx eslint src/features/player/PlaybackController.ts src/features/player/TTSBufferManager.ts src/features/settings/SettingsPage.tsx src/features/settings/PocketVoiceSetupSheet.tsx src/services/storage/settingsRepository.ts src/services/tts/index.ts src/services/tts/ttsManager.ts src/services/tts/types.ts

      - name: Production build
        run: npm run build

      - name: Diff sanity
        run: git diff --check

      - name: Commit validated rollback
        run: |
          rm -f .github/workflows/restore-pre-voicebox-stable.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore stable pre-Voicebox reader and simplify Settings"
          git push origin HEAD:restore/pre-voicebox-stable
