name: Restore pre-Voicebox stable app

on:
  push:
    branches:
      - restore/pre-voicebox-stable

permissions:
  contents: write

jobs:
  restore-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/pre-voicebox-stable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore stable runtime and audit Settings wiring
        run: python tools/restore_pre_voicebox_stable.py
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint touched runtime files
        run: npx eslint src/features/player/PlaybackController.ts src/features/player/TTSBufferManager.ts src/features/settings/SettingsPage.tsx src/features/settings/PocketVoiceSetupSheet.tsx src/services/storage/settingsRepository.ts src/services/tts/index.ts src/services/tts/ttsManager.ts src/services/tts/types.ts
      - name: Production build
        run: npm run build
      - name: Diff sanity
        run: git diff --check
      - name: Commit validated rollback
        run: |
          rm -f .github/workflows/restore-pre-voicebox-stable.yml tools/restore_pre_voicebox_stable.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore stable pre-Voicebox reader and simplify Settings"
          git push origin HEAD:restore/pre-voicebox-stable
