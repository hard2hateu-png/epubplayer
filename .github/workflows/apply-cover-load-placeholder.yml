name: Apply cover load placeholder patch

on:
  push:
    branches: [hide-cover-load-flash]
    paths:
      - 'scripts/apply-cover-load-placeholder.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hide-cover-load-flash

      - name: Apply patch
        run: node scripts/apply-cover-load-placeholder.cjs

      - name: Commit patched player
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/player/NowPlayingPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Hide broken cover icon while cover refreshes"
          git push origin HEAD:hide-cover-load-flash
