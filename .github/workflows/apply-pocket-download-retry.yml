name: Apply Pocket model download retry

on:
  push:
    branches: [experiment-pocket-leo-prosody]
    paths:
      - '.github/scripts/apply_pocket_download_retry.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-leo-prosody
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply bounded Pocket 429 retry patch
        run: python .github/scripts/apply_pocket_download_retry.py
      - name: Install dependencies
        run: npm ci
      - name: Run chunking regression tests
        run: npx vitest run src/services/tts/textChunking.test.ts
      - name: Build app
        run: npm run build
      - name: Verify retry is isolated
        run: |
          grep -q "Rate limited downloading" src/services/tts/pocketService.ts
          grep -q "res.status !== 429" src/services/tts/pocketService.ts
          grep -q "MODEL_BASE = 'https://huggingface.co/vlapky/pocket-tts-onnx/resolve/main/onnx'" src/services/tts/pocketService.ts
          grep -q "EMBEDDING_PATH = '/__epubplayer/pocket/voices/leo-embedding-v4-single-12s'" src/services/tts/pocketService.ts
      - name: Commit tested patch and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/apply_pocket_download_retry.py .github/workflows/apply-pocket-download-retry.yml
          git add src/services/tts/pocketService.ts
          git commit -m 'Retry transient Pocket model rate limits'
          git push origin HEAD:experiment-pocket-leo-prosody
