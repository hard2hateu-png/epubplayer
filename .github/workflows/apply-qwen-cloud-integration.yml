name: Apply Qwen cloud integration

on:
  push:
    branches:
      - experiment/qwen-cloud-leo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/qwen-cloud-leo
          fetch-depth: 0

      - name: Apply Qwen integration patch
        run: python .github/scripts/apply_qwen_cloud_integration.py

      - name: Check JavaScript proxy syntax
        run: node --check api/qwen-cloud.js

      - name: Check diff
        run: git diff --check

      - name: Build app
        run: |
          npm ci
          npm run build

      - name: Commit integration sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/qwen-cloud.js \
            src/services/tts/qwenCloudService.ts \
            src/services/tts/types.ts \
            src/services/tts/index.ts \
            src/services/tts/ttsManager.ts \
            src/features/player/TTSBufferManager.ts \
            src/features/settings/QwenCloudSetupSheet.tsx \
            src/features/settings/SettingsPage.tsx \
            vercel.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Integrate Qwen3-TTS cloud Leo voice"
          git push origin HEAD:experiment/qwen-cloud-leo
