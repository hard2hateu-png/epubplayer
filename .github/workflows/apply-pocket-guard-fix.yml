name: Apply Pocket warmup guard fix

on:
  push:
    branches:
      - fix/pocket-warmup-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pocket-warmup-guard
          fetch-depth: 0

      - name: Apply narrow Pocket patch
        run: python .github/scripts/apply_pocket_guard_fix.py

      - name: Check diff
        run: git diff --check

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/tts/pocketService.ts src/features/player/TTSBufferManager.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add Pocket warmup and bad-audio retry guard"
          git push origin HEAD:fix/pocket-warmup-guard
