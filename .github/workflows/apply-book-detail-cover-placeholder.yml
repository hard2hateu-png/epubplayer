name: Apply book detail cover placeholder

on:
  push:
    branches: [fix-book-detail-cover-flash]
    paths:
      - 'scripts/apply-book-detail-cover-placeholder.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-book-detail-cover-flash

      - name: Apply patch
        run: node scripts/apply-book-detail-cover-placeholder.cjs

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/library/BookDetailPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Hide broken cover flash on book detail"
          git push origin HEAD:fix-book-detail-cover-flash
