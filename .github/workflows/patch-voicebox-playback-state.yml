name: Patch Voicebox playback state

on:
  push:
    branches:
      - fix/voicebox-playback-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voicebox-playback-state

      - name: Fix Voicebox initialization and playback races
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} matches, found {actual}: {old[:100]!r}')
              s = s.replace(old, new, count)
              p.write_text(s)

          # --- ttsManager: invalidate stale async initialization when engines change ---
          path = 'src/services/tts/ttsManager.ts'
          replace(path,
              "  private initPromise: Promise<void> | null = null\n",
              "  private initPromise: Promise<void> | null = null\n  private initGeneration = 0\n")

          replace(path,
              "    this.isInitializing = true\n    this.initPromise = this.doInitialize()\n    return this.initPromise\n  }\n\n  private async doInitialize(): Promise<void> {\n    try {\n      const engine = await settingsRepository.get('ttsEngine')\n      this.currentEngine = engine\n",
              "    const generation = this.initGeneration\n    this.isInitializing = true\n    this.initPromise = this.doInitialize(generation)\n    return this.initPromise\n  }\n\n  private async doInitialize(generation: number): Promise<void> {\n    try {\n      const engine = await settingsRepository.get('ttsEngine')\n      if (generation !== this.initGeneration) return\n      this.currentEngine = engine\n")

          replace(path,
              "      this.markReady()\n    } catch (error) {\n      this.isInitializing = false\n      this.initPromise = null\n      throw error\n    }\n  }\n",
              "      if (generation !== this.initGeneration) {\n        log.debug('Ignoring stale TTS initialization completion', { engine })\n        return\n      }\n      this.markReady()\n    } catch (error) {\n      if (generation === this.initGeneration) {\n        this.isInitializing = false\n        this.initPromise = null\n      }\n      throw error\n    }\n  }\n")

          replace(path,
              "    }\n    this.isInitialized = false\n  }\n\n  async setEngine(engine: TTSEngine): Promise<void> {\n",
              "    }\n    this.initGeneration += 1\n    this.isInitialized = false\n    this.isInitializing = false\n    this.initPromise = null\n  }\n\n  async setEngine(engine: TTSEngine): Promise<void> {\n")

          # --- Voicebox service: timeout dead tunnels and ignore stale pairing work ---
          path = 'src/services/tts/voiceboxRemoteService.ts'
          replace(path,
              "  private initPromise: Promise<void> | null = null\n",
              "  private initPromise: Promise<void> | null = null\n  private initGeneration = 0\n")

          replace(path,
              "    localStorage.setItem(BASE_URL_KEY, normalized)\n    localStorage.setItem(ACCESS_TOKEN_KEY, token)\n    this.destroy()\n",
              "    // Cancel work against the old session before swapping credentials.\n    this.destroy()\n    localStorage.setItem(BASE_URL_KEY, normalized)\n    localStorage.setItem(ACCESS_TOKEN_KEY, token)\n")

          replace(path,
              "  clearConfig(): void {\n    if (typeof localStorage !== 'undefined') {\n      localStorage.removeItem(BASE_URL_KEY)\n      localStorage.removeItem(ACCESS_TOKEN_KEY)\n      localStorage.removeItem(PROFILE_ID_KEY)\n    }\n    this.destroy()\n  }\n",
              "  clearConfig(): void {\n    this.destroy()\n    if (typeof localStorage !== 'undefined') {\n      localStorage.removeItem(BASE_URL_KEY)\n      localStorage.removeItem(ACCESS_TOKEN_KEY)\n      localStorage.removeItem(PROFILE_ID_KEY)\n    }\n  }\n")

          old_request = """    try {
      return await fetch(`/api/voicebox-relay?path=${encodeURIComponent(path)}`, {
        ...init,
        headers,
        cache: 'no-store',
        credentials: 'same-origin',
      })
    } catch (error) {
      const detail = error instanceof Error ? error.message : String(error)
      throw new Error(`Could not reach the EPUB Player Voicebox relay: ${detail}`)
    }
"""
          new_request = """    const timeoutMs = path === '/transcribe' || path.includes('/samples') ? 90_000 : 45_000
    const controller = new AbortController()
    const upstreamSignal = init.signal
    const abortFromCaller = () => controller.abort()
    if (upstreamSignal) upstreamSignal.addEventListener('abort', abortFromCaller, { once: true })
    const timeout = setTimeout(() => controller.abort(), timeoutMs)

    try {
      return await fetch(`/api/voicebox-relay?path=${encodeURIComponent(path)}`, {
        ...init,
        headers,
        cache: 'no-store',
        credentials: 'same-origin',
        signal: controller.signal,
      })
    } catch (error) {
      if (controller.signal.aborted && !upstreamSignal?.aborted) {
        throw new Error(`Voicebox request timed out after ${Math.round(timeoutMs / 1000)} seconds. Re-pair the current Kaggle session and try again.`)
      }
      const detail = error instanceof Error ? error.message : String(error)
      throw new Error(`Could not reach the EPUB Player Voicebox relay: ${detail}`)
    } finally {
      clearTimeout(timeout)
      upstreamSignal?.removeEventListener('abort', abortFromCaller)
    }
"""
          replace(path, old_request, new_request)

          replace(path,
              "    this.isLoading = true\n    this.initPromise = this.doInitialize()\n    try {\n      await this.initPromise\n    } finally {\n      this.initPromise = null\n    }\n  }\n\n  private async doInitialize(): Promise<void> {\n    try {\n      this.onProgressCallback?.('Connecting to Voicebox…', 5)\n      await this.testConnection()\n      await this.ensureLeoProfile()\n      this.isReady = true\n      this.isLoading = false\n      this.onProgressCallback?.('Voicebox — Leo ready', 100)\n      this.onReadyCallback?.()\n    } catch (error) {\n      this.isReady = false\n      this.isLoading = false\n      const message = error instanceof Error ? error.message : String(error)\n      this.onErrorCallback?.(message)\n      throw error\n    }\n  }\n",
              "    const generation = this.initGeneration\n    this.isLoading = true\n    this.initPromise = this.doInitialize(generation)\n    try {\n      await this.initPromise\n    } finally {\n      if (generation === this.initGeneration) this.initPromise = null\n    }\n  }\n\n  private async doInitialize(generation: number): Promise<void> {\n    try {\n      this.onProgressCallback?.('Connecting to Voicebox…', 5)\n      await this.testConnection()\n      if (generation !== this.initGeneration) return\n      await this.ensureLeoProfile()\n      if (generation !== this.initGeneration) return\n      this.isReady = true\n      this.isLoading = false\n      this.onProgressCallback?.('Voicebox — Leo ready', 100)\n      this.onReadyCallback?.()\n    } catch (error) {\n      if (generation === this.initGeneration) {\n        this.isReady = false\n        this.isLoading = false\n        const message = error instanceof Error ? error.message : String(error)\n        this.onErrorCallback?.(message)\n      }\n      throw error\n    }\n  }\n")

          replace(path,
              "  destroy(): void {\n    this.cancelAll()\n    this.isReady = false\n    this.isLoading = false\n    this.initPromise = null\n  }\n",
              "  destroy(): void {\n    this.initGeneration += 1\n    this.cancelAll()\n    this.isReady = false\n    this.isLoading = false\n    this.initPromise = null\n  }\n")

          # --- PlaybackController: Voicebox initializes only when Play is pressed ---
          path = 'src/features/player/PlaybackController.ts'
          replace(path,
              "        if (!deferPocketOnIOS && capabilities.requiresInit && !ttsManager.getIsReady() && !ttsManager.getIsLoading()) {\n",
              "        const deferVoiceboxUntilPlay = this.currentEngine === 'voicebox'\n        const deferTTSUntilPlay = deferPocketOnIOS || deferVoiceboxUntilPlay\n\n        if (!deferTTSUntilPlay && capabilities.requiresInit && !ttsManager.getIsReady() && !ttsManager.getIsLoading()) {\n")

          replace(path,
              "        } else if (deferPocketOnIOS) {\n          log.info('Deferring Pocket TTS initialization until Play on iOS')\n        }\n",
              "        } else if (deferVoiceboxUntilPlay) {\n          log.info('Deferring Voicebox initialization until Play')\n        } else if (deferPocketOnIOS) {\n          log.info('Deferring Pocket TTS initialization until Play on iOS')\n        }\n")

          replace(path,
              "    const newEngine = settings.ttsEngine as TTSEngine\n    const newVoiceId = this.getVoiceForEngine(settings)\n",
              "    const newEngine = settings.ttsEngine as TTSEngine\n    const newVoiceId = this.getVoiceForEngine(settings, newEngine)\n")

          replace(path,
              "      // Pre-initialize the TTS engine\n      if (capabilities.requiresInit && !ttsManager.getIsReady() && !ttsManager.getIsLoading()) {\n",
              "      // Remote Voicebox sessions are intentionally initialized on Play.\n      // This keeps Settings/Library responsive and avoids stale background pairing work.\n      const deferVoiceboxUntilPlay = newEngine === 'voicebox'\n      if (!deferVoiceboxUntilPlay && capabilities.requiresInit && !ttsManager.getIsReady() && !ttsManager.getIsLoading()) {\n")

          replace(path,
              "  private getVoiceForEngine(settings: {\n    voiceId: string\n    piperModel: string\n    supertonicVoice: string\n    sherpaVoice: string\n    kittenVoice: string\n  }): string {\n    switch (this.currentEngine) {\n",
              "  private getVoiceForEngine(settings: {\n    voiceId: string\n    piperModel: string\n    supertonicVoice: string\n    sherpaVoice: string\n    kittenVoice: string\n  }, engine: TTSEngine = this.currentEngine): string {\n    switch (engine) {\n")

          # --- Settings: pairing a new tunnel invalidates old runtime state immediately ---
          path = 'src/features/settings/SettingsPage.tsx'
          replace(path,
              "    { id: 'voicebox' as TTSEngine, name: t`Voicebox + Qwen3-TTS (Leo)`, description: t`Free/open-source Leo clone using a remote GPU such as a free Google Colab session.` },\n",
              "    { id: 'voicebox' as TTSEngine, name: t`Voicebox + Qwen3-TTS (Leo)`, description: t`Free/open-source Leo clone using a remote GPU such as a free Kaggle session.` },\n")
          replace(path,
              "      voiceboxRemoteService.configure(voiceboxUrl, voiceboxToken)\n      setActiveSheet('voiceboxLeo')\n",
              "      voiceboxRemoteService.configure(voiceboxUrl, voiceboxToken)\n      // A new tunnel/token must invalidate any old in-flight Voicebox init.\n      ttsManager.destroy()\n      void playbackController.reloadTTSSettings().catch((e) => {\n        console.warn('[Settings] Failed to apply new Voicebox pairing:', e)\n      })\n      setActiveSheet('voiceboxLeo')\n")

          # --- Voicebox sheet: connect without a full-page reload or hidden pre-init ---
          path = 'src/features/settings/VoiceboxRemoteSetupSheet.tsx'
          replace(path,
              "import { settingsRepository } from '@/services/storage/settingsRepository'\n",
              "import { settingsRepository } from '@/services/storage/settingsRepository'\nimport { playbackController } from '@/features/player/PlaybackController'\n")
          replace(path,
              "      const status = await voiceboxRemoteService.testConnection()\n      setMessage(`Connected (${status}). Preparing Leo…`)\n      await voiceboxRemoteService.initialize()\n      await settingsRepository.set('voiceId', 'voicebox:leo')\n      await settingsRepository.set('ttsEngine', 'voicebox')\n      setActive(true)\n      ttsManager.destroy()\n      window.location.reload()\n",
              "      const status = await voiceboxRemoteService.testConnection()\n      await settingsRepository.set('voiceId', 'voicebox:leo')\n      await settingsRepository.set('ttsEngine', 'voicebox')\n      ttsManager.destroy()\n      await playbackController.reloadTTSSettings()\n      setActive(true)\n      setMessage(`Connected (${status}). Press Play to prepare Leo and start Voicebox.`)\n      setBusy(false)\n")
          replace(path,
              "            {busy ? 'Preparing Voicebox Leo…' : active ? 'Reconnect Voicebox Leo' : 'Use Voicebox Leo for TTS'}\n",
              "            {busy ? 'Connecting Voicebox…' : active ? 'Reconnect Voicebox Leo' : 'Use Voicebox Leo for TTS'}\n")

          print('Voicebox playback-state patch applied.')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/tts/ttsManager.ts src/services/tts/voiceboxRemoteService.ts src/features/player/PlaybackController.ts src/features/settings/SettingsPage.tsx src/features/settings/VoiceboxRemoteSetupSheet.tsx
          git commit -m "Fix Voicebox playback initialization races"
          git push origin HEAD:fix/voicebox-playback-state
