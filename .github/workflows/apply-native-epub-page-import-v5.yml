name: Apply native EPUB page import v5

on:
  push:
    branches: [fix-native-epub-page-import-v5]
    paths:
      - 'scripts/fix-native-epub-page-import-v5.cjs'
      - '.github/workflows/apply-native-epub-page-import-v5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-native-epub-page-import-v5
          fetch-depth: 0

      - name: Apply import patch
        run: node scripts/fix-native-epub-page-import-v5.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/contentParsers/types.ts src/services/contentParsers/epubAdapter.ts src/features/import/saveImport.ts
          if git diff --cached --quiet; then
            echo "No import changes to commit"
          else
            git commit -m "Preserve EPUB page data during import"
            git push origin HEAD:fix-native-epub-page-import-v5
          fi
