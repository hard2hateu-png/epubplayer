name: Apply Pocket audio quality fix

on:
  push:
    branches:
      - fix/pocket-audio-quality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pocket-audio-quality
          fetch-depth: 0

      - name: Apply Pocket quality changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Pocket service: stable sampling, proper full-reference embedding,
          # and strictly serialized inference so foreground/background requests
          # can never share the worker's single audio callback.
          p = Path('src/services/tts/pocketService.ts')
          s = p.read_text()

          s = s.replace(
              "const EMBEDDING_PATH = '/__epubplayer/pocket/voices/leo-embedding-v2-full'",
              "const EMBEDDING_PATH = '/__epubplayer/pocket/voices/leo-embedding-v3-sequence'",
              1,
          )
          s = s.replace("const EMBEDDING_MAGIC = 'LEOEMB02'", "const EMBEDDING_MAGIC = 'LEOEMB03'", 1)

          old = '''function averageEmbeddings(items: VoiceEmbedding[]): VoiceEmbedding {
  if (!items.length) throw new Error('No Leo voice embeddings were produced')
  const first = items[0]
  const shape = first.shape.slice()
  const length = first.data.length
  for (const item of items) {
    if (item.data.length !== length || item.shape.join(',') !== shape.join(',')) {
      throw new Error('Leo voice embedding shapes did not match')
    }
  }
  const data = new Float32Array(length)
  for (const item of items) {
    for (let i = 0; i < length; i++) data[i] += item.data[i] / items.length
  }
  return { data, shape }
}
'''
          new = '''function concatenateEmbeddings(items: VoiceEmbedding[]): VoiceEmbedding {
  if (!items.length) throw new Error('No Leo voice embeddings were produced')
  const first = items[0]
  if (first.shape.length !== 3 || first.shape[0] !== 1) {
    throw new Error('Unexpected Leo voice embedding shape')
  }
  const featureDim = first.shape[2]
  let totalFrames = 0
  let totalValues = 0
  for (const item of items) {
    if (item.shape.length !== 3 || item.shape[0] !== 1 || item.shape[2] !== featureDim) {
      throw new Error('Leo voice embedding feature shapes did not match')
    }
    if (item.data.length !== item.shape[1] * featureDim) {
      throw new Error('Leo voice embedding length did not match its shape')
    }
    totalFrames += item.shape[1]
    totalValues += item.data.length
  }
  const data = new Float32Array(totalValues)
  let offset = 0
  for (const item of items) {
    data.set(item.data, offset)
    offset += item.data.length
  }
  return { data, shape: [1, totalFrames, featureDim] }
}
'''
          assert old in s
          s = s.replace(old, new, 1)

          # Patch the browser bridge to match newer Pocket stability choices.
          old = '''function patchWorker(source: string, tokenizerUrl: string, binaryUrl: string): string {
  let result = source
    .replace('"./tokenizer.js"', JSON.stringify(tokenizerUrl))
    .replace('"./binary.js"', JSON.stringify(binaryUrl))
'''
          new = '''function patchWorker(source: string, tokenizerUrl: string, binaryUrl: string): string {
  let result = source
    .replace('"./tokenizer.js"', JSON.stringify(tokenizerUrl))
    .replace('"./binary.js"', JSON.stringify(binaryUrl))
    .replace('const TEMPERATURE = 0.7;', 'const TEMPERATURE = 0.3;')
    .replace('const CHUNK_GAP_SEC = 0.25;', 'const CHUNK_GAP_SEC = 0.12;')

  // Newer Pocket releases split long sentences at clause punctuation instead of
  // blindly slicing token IDs. That avoids missing words and awkward mid-clause cuts.
  const tokenSplitOriginal = `function splitTokenIdsIntoChunks(tokenIds, maxTokens) {
    const chunks = [];
    for (let i = 0; i < tokenIds.length; i += maxTokens) {
        const chunkText = tokenizer.decodeIds(tokenIds.slice(i, i + maxTokens)).trim();
        if (chunkText) chunks.push(chunkText);
    }
    return chunks;
}`
  const tokenSplitPatched = `${tokenSplitOriginal}

function splitLongSentenceAtClauses(sentenceText, maxTokens) {
    const parts = sentenceText.match(/[^,;:—–]+[,;:—–]?/g) || [sentenceText];
    const chunks = [];
    let current = "";
    for (const rawPart of parts) {
        const part = rawPart.trim();
        if (!part) continue;
        const combined = current ? current + " " + part : part;
        if (tokenizer.encodeIds(combined).length <= maxTokens) {
            current = combined;
            continue;
        }
        if (current) {
            chunks.push(current.trim());
            current = "";
        }
        const partIds = tokenizer.encodeIds(part);
        if (partIds.length <= maxTokens) current = part;
        else chunks.push(...splitTokenIdsIntoChunks(partIds, maxTokens));
    }
    if (current) chunks.push(current.trim());
    return chunks;
}`
  if (!result.includes(tokenSplitOriginal)) throw new Error('Pocket worker token split patch no longer matches')
  result = result.replace(tokenSplitOriginal, tokenSplitPatched)

  const longSentenceOriginal = `for (const splitChunk of splitTokenIdsIntoChunks(sentenceTokenIds, maxTokenPerChunk)) {`
  const longSentencePatched = `for (const splitChunk of splitLongSentenceAtClauses(sentenceText, maxTokenPerChunk)) {`
  if (!result.includes(longSentenceOriginal)) throw new Error('Pocket worker long-sentence patch no longer matches')
  result = result.replace(longSentenceOriginal, longSentencePatched)
'''
          assert old in s
          s = s.replace(old, new, 1)

          # With serialized generation and a lightweight cached embedding runtime,
          # use normal 220-char app chunks on iOS; Pocket's internal clause splitter
          # handles long sentences without arbitrary word loss.
          old = '''      const maxChunkChars = await settingsRepository.get('maxChunkChars')
      const deviceMaxChunkChars = isIOSDevice() ? 150 : MAX_CHUNK_CHARS
      this.config = { maxChunkChars: Math.min(deviceMaxChunkChars, Math.max(120, maxChunkChars)) }
'''
          new = '''      const maxChunkChars = await settingsRepository.get('maxChunkChars')
      this.config = { maxChunkChars: Math.min(MAX_CHUNK_CHARS, Math.max(120, maxChunkChars)) }
'''
          assert old in s
          s = s.replace(old, new, 1)

          assert 'embedding = averageEmbeddings(embeddings)' in s
          s = s.replace('embedding = averageEmbeddings(embeddings)', 'embedding = concatenateEmbeddings(embeddings)', 1)

          # Add a generation mutex. The underlying browser worker has one chunk
          # callback and does not safely support overlapping generate() calls.
          old = '''  private requestCounter = 0
  private cancelEpoch = 0
  private onAudioCallback?: AudioCallback
'''
          new = '''  private requestCounter = 0
  private cancelEpoch = 0
  private generationTail: Promise<void> = Promise.resolve()
  private onAudioCallback?: AudioCallback
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  async generateChunk(text: string, chunkIndex: number): Promise<PocketGeneratedAudio> {
    await this.initialize()
'''
          new = '''  async generateChunk(text: string, chunkIndex: number): Promise<PocketGeneratedAudio> {
    const run = this.generationTail.then(
      () => this.generateChunkSerial(text, chunkIndex),
      () => this.generateChunkSerial(text, chunkIndex),
    )
    this.generationTail = run.then(() => undefined, () => undefined)
    return run
  }

  private async generateChunkSerial(text: string, chunkIndex: number): Promise<PocketGeneratedAudio> {
    await this.initialize()
'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)

          # Buffer manager: invalidate old Pocket audio and make look-ahead a bit
          # smoother now that Pocket inference is serialized and the encoder is unloaded.
          p = Path('src/features/player/TTSBufferManager.ts')
          s = p.read_text()

          old = '''type ChunkKey = string

function makeChunkKey(ctx: BufferContext, chunk: ChunkInfo): ChunkKey {
  // Include engine in the key to avoid conflicts between Kokoro and Piper cached audio
  return `${ctx.bookId}:${chunk.sectionIndex}:${chunk.chunkIndex}:${ctx.voiceId}:${ctx.modelConfig}:${ctx.engine}:${chunk.textHash}`
}
'''
          new = '''type ChunkKey = string
const POCKET_AUDIO_CACHE_VERSION = 'pocket-quality-v3'

function cacheModelConfig(ctx: BufferContext): string {
  return ctx.engine === 'pocket' ? `${ctx.modelConfig}:${POCKET_AUDIO_CACHE_VERSION}` : ctx.modelConfig
}

function makeChunkKey(ctx: BufferContext, chunk: ChunkInfo): ChunkKey {
  // Include engine + Pocket synthesis version so previously glitched audio is never reused.
  return `${ctx.bookId}:${chunk.sectionIndex}:${chunk.chunkIndex}:${ctx.voiceId}:${cacheModelConfig(ctx)}:${ctx.engine}:${chunk.textHash}`
}
'''
          assert old in s
          s = s.replace(old, new, 1)

          # Exactly three repository lookups/saves use the context modelConfig.
          count = s.count('      this.ctx.modelConfig,')
          assert count == 3, count
          s = s.replace('      this.ctx.modelConfig,', '      cacheModelConfig(this.ctx),')

          s = s.replace('const IOS_POCKET_MAX_BUFFER_CHUNKS = 2', 'const IOS_POCKET_MAX_BUFFER_CHUNKS = 3', 1)
          s = s.replace(
              "const iOSBreather = isIOSDevice() ? (this.ctx?.engine === 'pocket' ? 500 : 40) : 0",
              "const iOSBreather = isIOSDevice() ? (this.ctx?.engine === 'pocket' ? 150 : 40) : 0",
              1,
          )
          p.write_text(s)
          PY

          git diff --check
          git status --short

      - name: Build
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/tts/pocketService.ts src/features/player/TTSBufferManager.ts
          if git diff --cached --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git commit -m "Improve Pocket TTS narration stability"
          git push origin HEAD:fix/pocket-audio-quality
