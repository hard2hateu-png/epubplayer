name: Apply Pocket dialogue prosody experiment

on:
  push:
    branches:
      - experiment-pocket-leo-prosody

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[pocket-prosody-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-leo-prosody
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Pocket-only dialogue prosody patch
        run: python .github/scripts/apply_pocket_dialogue_prosody.py
      - name: Install dependencies
        run: npm ci
      - name: Run text chunking regression tests
        run: npx vitest run src/services/tts/textChunking.test.ts
      - name: Build app
        run: npm run build
      - name: Verify runtime architecture stayed stable
        run: |
          grep -q "VENDOR_COMMIT = '7d7a27423b0845eb0425c81a8aa5ed3f3d973eef'" src/services/tts/pocketService.ts
          grep -q "quantized: true" src/services/tts/pocketService.ts
          grep -q "maxThreads: isIOSDevice() ? 1 : 4" src/services/tts/pocketService.ts
          grep -q "CONDITIONING_SECONDS = 12" src/services/tts/pocketService.ts
          grep -q "EMBEDDING_MAGIC = 'LEOEMB04'" src/services/tts/pocketService.ts
      - name: Commit tested experiment and remove one-shot machinery
        run: |
          rm .github/scripts/apply_pocket_dialogue_prosody.py
          rm .github/workflows/apply-pocket-dialogue-prosody.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/tts/textChunking.ts src/services/tts/textChunking.test.ts src/services/tts/pocketService.ts .github/scripts/apply_pocket_dialogue_prosody.py .github/workflows/apply-pocket-dialogue-prosody.yml
          git commit -m "Improve Pocket dialogue phrasing [pocket-prosody-applied]"
          git push origin HEAD:experiment-pocket-leo-prosody
