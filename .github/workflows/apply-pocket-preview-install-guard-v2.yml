name: Apply Pocket preview install guard v2

on:
  push:
    branches:
      - experiment-pocket-leo-prosody
    paths:
      - .github/workflows/apply-pocket-preview-install-guard-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-leo-prosody
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/apply_pocket_install_guard.py
      - run: npm ci
      - run: npx vitest run src/services/tts/textChunking.test.ts
      - run: npm run build
      - name: Verify stable Pocket runtime is unchanged
        run: |
          grep -q "const hasLeoReference = await pocketService.hasLeoVoiceSample()" src/features/settings/SettingsPage.tsx
          grep -q "leo-embedding-v4-single-12s" src/services/tts/pocketService.ts
          grep -q "quantized: true" src/services/tts/pocketService.ts
          grep -q "maxThreads: isIOSDevice() ? 1 : 4" src/services/tts/pocketService.ts
      - name: Commit tested guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/settings/SettingsPage.tsx
          git rm .github/scripts/apply_pocket_install_guard.py
          git rm .github/workflows/apply-pocket-preview-install-guard-v2.yml
          git rm .github/workflows/apply-pocket-preview-install-guard.yml
          git commit -m "Guard Pocket activation until Leo is installed"
          git push origin HEAD:experiment-pocket-leo-prosody
