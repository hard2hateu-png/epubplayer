name: Apply Voicebox playback fix

on:
  push:
    branches:
      - fix/voicebox-playback-state

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voicebox-playback-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source patch
        run: python tools/patch_voicebox_playback_state.py
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/tts/ttsManager.ts src/services/tts/voiceboxRemoteService.ts src/features/player/PlaybackController.ts src/features/settings/SettingsPage.tsx src/features/settings/VoiceboxRemoteSetupSheet.tsx
          git commit -m "Fix Voicebox playback initialization races"
          git push origin HEAD:fix/voicebox-playback-state
