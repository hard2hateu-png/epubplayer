name: Apply iOS playback stability pass

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ios-stability-pass.cjs'
      - '.github/workflows/apply-ios-stability-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply stability patch
        run: node scripts/ios-stability-pass.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/storage/audioChunkRepository.ts src/features/player/TTSBufferManager.ts src/features/player/audioBackends/AudioBlobBackend.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reduce iOS playback memory pressure"
            git push origin HEAD:main
          fi

# Trigger after workflow is present on main.
