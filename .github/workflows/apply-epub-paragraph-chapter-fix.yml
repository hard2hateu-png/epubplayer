name: Apply EPUB paragraph and chapter fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-epub-paragraph-and-chapter-sync.cjs'
      - '.github/workflows/apply-epub-paragraph-chapter-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply EPUB fixes
        run: node scripts/fix-epub-paragraph-and-chapter-sync.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/epub/parser.ts src/services/tts/textChunking.ts src/features/player/PlaybackController.ts src/features/player/NowPlayingPage.tsx src/features/library/BookDetailPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix EPUB paragraph spacing and chapter sync"
            git push origin HEAD:main
          fi
