name: Apply mobile cover fit patch

on:
  push:
    branches: [fix-mobile-cover-fit]
    paths:
      - 'scripts/apply-mobile-cover-fit.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-mobile-cover-fit

      - name: Apply patch
        run: node scripts/apply-mobile-cover-fit.cjs

      - name: Commit patched player
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/player/NowPlayingPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep mobile cover inside player layout"
          git push origin HEAD:fix-mobile-cover-fit
