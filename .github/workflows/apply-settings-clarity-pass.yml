name: Apply settings clarity pass

on:
  push:
    branches: [main]
    paths:
      - 'scripts/settings-clarity-pass.cjs'
      - '.github/workflows/apply-settings-clarity-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply settings patch
        run: node scripts/settings-clarity-pass.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/settings/SettingsPage.tsx src/features/settings/useStorageStats.ts src/features/player/TTSBufferManager.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clarify storage and iOS buffer settings"
            git push origin HEAD:main
          fi
