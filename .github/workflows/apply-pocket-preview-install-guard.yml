name: Apply Pocket preview install guard

on:
  push:
    branches: [experiment-pocket-leo-prosody]
    paths:
      - '.github/workflows/apply-pocket-preview-install-guard.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-leo-prosody
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Guard Pocket activation until Leo exists
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/settings/SettingsPage.tsx')
          s = p.read_text()
          old = """          } else if (engine === 'pocket') {
            // Unique cache identity for Leo. Pocket itself always uses the local Leo clone.
            await settingsRepository.set('voiceId', 'pocket:leo')
            setSettings((prev) => ({ ...prev, voiceId: 'pocket:leo' }))
          }
"""
          new = """          } else if (engine === 'pocket') {
            // On a fresh origin, do not activate/reload Pocket until Leo exists.
            // Keep the current working engine alive while the user installs Leo.
            const hasLeoReference = await pocketService.hasLeoVoiceSample()
            if (!hasLeoReference) {
              setActiveSheet('pocketLeo')
              return
            }
            // Unique cache identity for Leo. Pocket itself always uses the local Leo clone.
            await settingsRepository.set('voiceId', 'pocket:leo')
            setSettings((prev) => ({ ...prev, voiceId: 'pocket:leo' }))
          }
"""
          if old not in s:
              raise SystemExit('Pocket engine selection block no longer matches expected stable code')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run chunking regression tests
        run: npx vitest run src/services/tts/textChunking.test.ts
      - name: Build app
        run: npm run build
      - name: Verify guard and stable Pocket runtime
        run: |
          grep -q "const hasLeoReference = await pocketService.hasLeoVoiceSample()" src/features/settings/SettingsPage.tsx
          grep -q "EMBEDDING_PATH = '/__epubplayer/pocket/voices/leo-embedding-v4-single-12s'" src/services/tts/pocketService.ts
          grep -q "quantized: true" src/services/tts/pocketService.ts
          grep -q "maxThreads: isIOSDevice() ? 1 : 4" src/services/tts/pocketService.ts
      - name: Commit tested guard and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-pocket-preview-install-guard.yml
          git add src/features/settings/SettingsPage.tsx
          git commit -m 'Guard Pocket activation until Leo is installed'
          git push origin HEAD:experiment-pocket-leo-prosody