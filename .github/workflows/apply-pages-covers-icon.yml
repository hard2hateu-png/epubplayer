name: Apply pages covers icon fixes

on:
  push:
    branches: [fix-pages-covers-app-icon]
    paths:
      - 'scripts/fix-pages-covers-icon.cjs'
      - '.github/workflows/apply-pages-covers-icon.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-pages-covers-app-icon

      - name: Apply patch
        run: node scripts/fix-pages-covers-icon.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/storage/db.ts src/services/epub/parser.ts src/features/player/PlaybackController.ts src/features/player/MiniPlayer.tsx src/ui/components/BookCover.tsx index.html vite.config.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix EPUB pages and cover quality"
          git push origin HEAD:fix-pages-covers-app-icon
