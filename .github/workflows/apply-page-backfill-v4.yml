name: Apply EPUB page backfill v4

on:
  push:
    branches: [fix-page-backfill-missing-hrefs]
    paths:
      - 'scripts/fix-page-backfill-v4.cjs'
      - '.github/workflows/apply-page-backfill-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-page-backfill-missing-hrefs
          fetch-depth: 0

      - name: Apply backfill patch
        run: node scripts/fix-page-backfill-v4.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/epub/parser.ts
          if git diff --cached --quiet; then
            echo "No parser changes to commit"
          else
            git commit -m "Fix page-map backfill for imported EPUBs"
            git push origin HEAD:fix-page-backfill-missing-hrefs
          fi
