name: Apply LiteRT split workers

on:
  push:
    branches:
      - experiment-pocket-litert

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[litert-split-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-litert
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply hard worker handoff
        run: python .github/scripts/split_litert_probe_stages.py

      - name: Install dependencies
        run: npm ci

      - name: Stable Pocket chunking tests
        run: npx vitest run src/services/tts/textChunking.test.ts

      - name: Production build
        run: npm run build

      - name: Verify split-stage probe
        run: |
          grep -q "generate-only" src/services/tts/litertPocketProbe.worker.ts
          grep -q "latent-result" src/services/tts/litertPocketProbe.worker.ts
          grep -q "litertPocketDecode.worker.ts" src/services/tts/litertPocketProbe.ts
          grep -q "Releasing Pocket GPU memory" src/services/tts/litertPocketProbe.ts

      - name: Commit tested generator patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/tts/litertPocketProbe.worker.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Hard-split Pocket LiteRT generation and decode workers [litert-split-applied]"
          git push origin HEAD:experiment-pocket-litert
