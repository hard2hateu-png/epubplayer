name: Apply instant cover previews

on:
  push:
    branches: [fix-instant-cover-previews]
    paths:
      - 'scripts/apply-instant-cover-previews.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-instant-cover-previews

      - name: Apply patch
        run: node scripts/apply-instant-cover-previews.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/components/BookCover.tsx src/features/library/BookDetailPage.tsx src/features/player/MiniPlayer.tsx src/features/player/NowPlayingPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make cover art refresh seamlessly"
          git push origin HEAD:fix-instant-cover-previews
