name: Apply Voicebox relay client patch

on:
  push:
    branches:
      - fix/voicebox-vercel-relay

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voicebox-vercel-relay
      - name: Route Voicebox requests through same-origin relay
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/tts/voiceboxRemoteService.ts')
          text = path.read_text()
          old = """  private async request(path: string, init: RequestInit = {}): Promise<Response> {
            const { baseUrl, accessToken } = this.getConfig()
            if (!baseUrl || !accessToken) throw new Error('Voicebox Colab server is not connected')
            return fetch(`${normalizeBaseUrl(baseUrl)}${path}`, {
              ...init,
              headers: this.headers(init.headers),
              cache: 'no-store',
              credentials: 'omit',
            })
          }
          """
          new = """  private async request(path: string, init: RequestInit = {}): Promise<Response> {
            const { baseUrl, accessToken } = this.getConfig()
            if (!baseUrl || !accessToken) throw new Error('Voicebox Colab server is not connected')

            // iOS Safari can fail direct authenticated requests to Cloudflare Quick
            // Tunnels during CORS/preflight with only a generic \"Load failed\". Send
            // the exact same request through our same-origin Vercel relay instead.
            // The temporary Voicebox URL/token stay in request headers and are never
            // written into the public app bundle or Vercel URL logs.
            const headers = new Headers(init.headers)
            headers.set('X-Voicebox-Upstream', normalizeBaseUrl(baseUrl))
            headers.set('X-Voicebox-Token', accessToken)

            try {
              return await fetch(`/api/voicebox-relay?path=${encodeURIComponent(path)}`, {
                ...init,
                headers,
                cache: 'no-store',
                credentials: 'same-origin',
              })
            } catch (error) {
              const detail = error instanceof Error ? error.message : String(error)
              throw new Error(`Could not reach the EPUB Player Voicebox relay: ${detail}`)
            }
          }
          """
          if old not in text:
              raise SystemExit('Voicebox request block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/tts/voiceboxRemoteService.ts
          git commit -m "Route Voicebox through same-origin relay"
          git push origin HEAD:fix/voicebox-vercel-relay
