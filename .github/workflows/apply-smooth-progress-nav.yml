name: Apply smooth progress and navigation patch

on:
  push:
    branches: [smooth-progress-nav]
    paths:
      - 'scripts/apply-smooth-progress-nav.cjs'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-smooth-progress-nav]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: smooth-progress-nav

      - name: Apply patch
        run: node scripts/apply-smooth-progress-nav.cjs

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/player/playerStore.ts \
                  src/features/player/PlaybackController.ts \
                  src/features/player/NowPlayingPage.tsx \
                  src/features/player/MiniPlayer.tsx \
                  src/features/library/BookDetailPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add smooth whole-book progress and quick navigation"
          git push origin HEAD:smooth-progress-nav
