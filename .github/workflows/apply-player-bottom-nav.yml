name: Apply player bottom navigation fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-player-nav-bottom.cjs'
      - '.github/workflows/apply-player-bottom-nav.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bottom navigation fix
        run: node scripts/fix-player-nav-bottom.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Pin player navigation to viewport bottom"
            git push origin HEAD:main
          fi
