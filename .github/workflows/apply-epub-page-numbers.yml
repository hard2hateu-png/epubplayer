name: Apply EPUB page numbers

on:
  push:
    branches: [feature-epub-page-numbers]
    paths:
      - 'scripts/apply-epub-page-numbers.cjs'
      - '.github/workflows/apply-epub-page-numbers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature-epub-page-numbers

      - name: Apply patch
        run: node scripts/apply-epub-page-numbers.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/storage/db.ts src/services/epub/parser.ts src/features/player/ChunkManager.ts src/features/player/PlaybackController.ts src/features/player/NowPlayingPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Show publisher EPUB page numbers during playback"
          git push origin HEAD:feature-epub-page-numbers
