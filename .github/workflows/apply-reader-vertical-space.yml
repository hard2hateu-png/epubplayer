name: Apply reader vertical space tweak

on:
  push:
    branches: [fix-reader-vertical-space]
    paths:
      - 'scripts/fix-reader-vertical-space.cjs'
      - '.github/workflows/apply-reader-vertical-space.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-reader-vertical-space
          fetch-depth: 0

      - name: Apply spacing patch
        run: node scripts/fix-reader-vertical-space.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit spacing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/player/NowPlayingPage.tsx src/features/player/LyricsView.tsx
          if git diff --cached --quiet; then
            echo "No spacing changes to commit"
          else
            git commit -m "Use more vertical space in mobile reader"
            git push origin HEAD:fix-reader-vertical-space
          fi
