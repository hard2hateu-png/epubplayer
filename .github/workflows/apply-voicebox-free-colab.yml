name: Apply Voicebox free Colab integration

on:
  push:
    branches:
      - feature/voicebox-free-colab

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voicebox-free-colab
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remove paid Qwen cloud integration
        run: git revert --no-edit 5bd997f0849b84c568fc3e5cc608e63d9d97df33

      - name: Apply Voicebox remote integration
        run: python .github/scripts/apply_voicebox_free_colab.py

      - name: Check diff
        run: git diff --check

      - name: Build app
        run: |
          npm ci
          npm run build

      - name: Commit Voicebox integration
        run: |
          git add src tools docs
          git commit -m "Add free Voicebox Colab Leo engine"
          git push origin HEAD:feature/voicebox-free-colab
