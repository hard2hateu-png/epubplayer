name: Apply LiteRT WASM asset fix

on:
  push:
    branches:
      - experiment-pocket-litert

permissions:
  contents: write

jobs:
  fix-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[litert-wasm-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment-pocket-litert
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply worker asset fix
        run: python .github/scripts/apply_litert_wasm_asset_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Stable Pocket chunking tests
        run: npx vitest run src/services/tts/textChunking.test.ts

      - name: Production build
        run: npm run build

      - name: Verify self-hosted LiteRT runtime
        run: |
          test -s dist/litert-wasm/litert_wasm_compat_internal.js
          test -s dist/litert-wasm/litert_wasm_compat_internal.wasm
          test -s dist/litert-wasm/litert_wasm_internal.js
          test -s dist/litert-wasm/litert_wasm_internal.wasm
          python - <<'PY'
          from pathlib import Path
          for name in ['litert_wasm_compat_internal.wasm', 'litert_wasm_internal.wasm']:
              p = Path('dist/litert-wasm') / name
              assert p.read_bytes()[:4] == b'\x00asm', f'{name} is not WebAssembly'
              print(name, p.stat().st_size, 'bytes, valid magic')
          PY
          grep -q "const LITERT_WASM = '/litert-wasm/'" src/services/tts/litertPocketProbe.worker.ts
          grep -q "configureLiteRtAssetLocator()" src/services/tts/litertPocketProbe.worker.ts

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts src/services/tts/litertPocketProbe.worker.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix Pocket LiteRT WASM resolution on Safari [litert-wasm-applied]"
          git push origin HEAD:experiment-pocket-litert
