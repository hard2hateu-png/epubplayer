name: Apply reader progress polish

on:
  push:
    branches: [fix-reader-progress-display]
    paths:
      - 'scripts/apply-reader-progress-polish.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-reader-progress-display

      - name: Apply patch
        run: node scripts/apply-reader-progress-polish.cjs

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/player/LyricsView.tsx src/features/player/NowPlayingPage.tsx src/features/library/BookDetailPage.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish reader header and progress labels"
          git push origin HEAD:fix-reader-progress-display
