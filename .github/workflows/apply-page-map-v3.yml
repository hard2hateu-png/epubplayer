name: Apply EPUB page map v3

on:
  push:
    branches: [fix-epub-page-map-v3]
    paths:
      - 'scripts/fix-page-map-v3.cjs'
      - '.github/workflows/apply-page-map-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-epub-page-map-v3
          fetch-depth: 0

      - name: Apply compatibility patch
        run: node scripts/fix-page-map-v3.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/epub/parser.ts
          if git diff --cached --quiet; then
            echo "No parser changes to commit"
          else
            git commit -m "Improve EPUB publisher page detection"
            git push origin HEAD:fix-epub-page-map-v3
          fi
